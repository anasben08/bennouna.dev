<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anas Bennouna</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --color-bg: #fafafa;
        --color-text: #1a1a1a;
        --color-text-muted: #666;
        --color-link: #0066cc;
        --color-link-hover: #004999;
        --color-border: #e5e5e5;
        --color-tag-bg: #f0f0f0;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
        --width-content: 42rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #1a1a1a;
          --color-text: #e5e5e5;
          --color-text-muted: #999;
          --color-link: #6db3f2;
          --color-link-hover: #9fcaf8;
          --color-border: #333;
          --color-tag-bg: #2a2a2a;
        }
      }

      html {
        font-size: 18px;
        line-height: 1.6;
      }

      body {
        margin: 4rem;
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
      }

      a {
        color: var(--color-link);
        text-decoration: none;
      }

      a:hover {
        color: var(--color-link-hover);
        text-decoration: underline;
      }

      .flex-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      @media (min-width: 768px) {
        .flex-container {
          flex-direction: row;
          gap: 2rem;
        }

        .flex-item {
          flex: 1;
        }
      }

      .profile {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      gap: 1.5rem;
      }   

      .box {
        border: 2px solid var(--color-link);
        background: var(--color-bg);
        box-shadow: 10px 10px 0 #000;
      }

      .socials {
  display: flex;
  justify-content: flex-start;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 1.5rem;
}

.social {
  padding: 0.4rem 0.8rem;
  box-shadow: 6px 6px 0 #000;
}

.social:hover {
  transform: translate(2px, 2px);
  box-shadow: 4px 4px 0 #000;
  text-decoration: none;
}

      .profile img {
        display: block;
        width: 130px;
        height: 130px;
       object-fit: cover;
      }

      .profile .text {
        padding: 1.5rem;
        max-width: 28rem;
      }
      footer {
  margin-top: 4rem;
    }

      .muted {
        color: var(--color-text-muted);
        }

      /* utils */
      .text-center {
        text-align: center;
      }

      .p-2 {
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <h1 class="text-center">Anas</h1>

   <div class="profile">
  <img class="box" src="photo.jpg" alt="Anas" />
  <div class="box text">
    <p>
      Hi, I'm Anas Bennouna, a computer science student at
      <a href="https://people.epfl.ch/409771">EPFL</a>.
    </p>
  </div>
</div>


<div class="flex-container">
  <div class="flex-item">
    <h2>Socials</h2>
    <div class="socials">
      <a class="box social" href="https://github.com/anasben08">GitHub</a>
      <a class="box social" href="https://www.linkedin.com/in/anas-bennouna">LinkedIn</a>
      <a class="box social" href="https://people.epfl.ch/409771">EPFL</a>
    </div>
  </div>
</div>

    <div class="flex-container">
      <!-- projects -->
      <div class="flex-item">
        <h2>Projects</h2>
        <p>I <em>try to</em> code cool projects :) look at my portfolio : <a href="https://anas.zip">anas.zip</a><em> (under construction)</em></p>
      </div>
    </div>
   <div class="flex-container">

      <div class="flex-item">
        <h2>Contact</h2>
               <p>Contact me at <a href="mailto:anas@bennouna.dev">anas@bennouna.dev</a></p>
      </div>
    </div>
    <footer class="text-center muted">
  <p>@Anas</p>
</footer>
  </body>
</html>
